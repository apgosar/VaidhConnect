name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # firebase-admin 14 requires Node >= 22; the Dockerfile and .nvmrc match.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Accessibility lint
        run: npm run lint:a11y
      - name: Tenant isolation guard
        run: npm run check:tenant
      - name: Tests
        run: npm test
      - name: Build (no secrets — mirrors the Cloud Build container)
        run: npm run build
        env:
          # Public client config only; deliberately fake. Real secrets must
          # never be needed at build time (see lib/firebase/server.ts).
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
